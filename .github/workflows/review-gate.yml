# Review gate: LAW 44 protocol (crew#105). A pull request does not land on a green
# QA run alone -- crew-qa.yml proves the code works, this proves a second person or
# session looked at it. DoD item 3 in crew#105: "peer review recorded ... The
# reviewing lane is named in the PR body."
#
# WHY A SIBLING FILE, NOT A JOB ADDED TO crew-qa.yml. crew-qa.yml is the QA lane a
# green run already depends on. Editing its jobs to bolt on an unrelated check risks
# breaking that lane; crew#105 itself orders this as a sibling file so a mistake here
# cannot take crew-qa.yml down with it. This file adds a new workflow only -- no line
# of crew-qa.yml is touched.
#
# IDENTITY IS THE SESSION, NOT THE GITHUB LOGIN. Every session on this estate pushes
# and comments as the one GitHub login this repo has -- `gh api collaborators`
# returns exactly one login, `chidionyema`, measured before this fix was written.
# The first version of this file compared `.user.login` between the PR author and
# the reviewer, which can never differ on this repo: it would have blocked every
# pull request forever, which is the LAW 38 outage ("a guard that refuses correct
# work is an outage"). Fixed the same day it was caught, before merge. Identity here
# is a self-declared session name in two PR-body lines instead: `Author-session:`
# and `Reviewed-by:`, which must name two different sessions, plus a `REVIEW:`
# comment or review naming the same session as `Reviewed-by:`.
#
# HONEST LIMIT. Session names are self-declared text in a PR body and a comment,
# not an authenticated identity -- nothing here cryptographically proves the named
# session is who posted the `REVIEW:` comment, only that someone typed the name.
# This gate proves the PROCESS was followed (two named sessions, one comment tying
# them together), not identity. The transcript corpus is the audit trail for
# identity, if that is ever disputed -- this gate does not attempt to replace it.
#
# FAIL-CLOSED, NOT FAIL-OPEN. PR #99 shipped a fallback that treated a `gh api` error
# as "no review found yet, therefore pass," and a red PR merged the same day on that
# fallback. Every branch below that cannot prove BOTH conditions exits 1.
# `set -euo pipefail` means a `gh api` error, a bad token, or a rate limit ends the
# job non-zero; there is no code path here that reads an error or an empty result as
# a pass.
#
## How this gate can fail
#
# 1. The PR body is missing an `Author-session: <name>` line, is missing a
#    `Reviewed-by: <name>` line, either line is empty or still the unfilled
#    `<...>` template placeholder, either name is literally "author", or the two
#    names are the same (case-insensitive) -- no self-review by typing two labels
#    for one session.
# 2. No comment on the issue thread and no formal review on the PR contains the
#    literal string "REVIEW:" together with the word "session" followed by the
#    same name that appears on the `Reviewed-by:` line, case-insensitive
#    (`REVIEW: <findings> — session <name>` is the documented shape).
# 3. `gh api` itself fails for any reason -- network, auth, rate limit, a renamed
#    endpoint. `set -euo pipefail` turns that failure into job failure; there is no
#    try/fallback that lets an unreadable API answer through as a pass.
#
# Testing rung: none of the seven rungs in ~/AGENTS.md How-to-test fit a declarative
# GitHub Actions workflow -- there is no unit to run offline against a fake `gh api`
# without rebuilding gh itself as a mock, which tests the mock, not the gate. This
# file's own first live pull request is the oracle, the same as crew-qa.yml before
# it: this PR opens red against this gate (no reviewer exists for it yet) and that
# red run is the proof the fail-closed branch fires, not a passing self-test.
#
# That held until 2026-08-24, and it is now half true. The `gh api` calls still have no
# offline oracle. The two expressions that read the PR body do:
# tests/test_incident_the_review_gate_read_a_whole_line_as_a_name.py reads the `grep -Po`
# patterns and the `bad_name()` patterns OUT OF THIS FILE and runs them, so an edit here
# that breaks them fails a test rather than a pull request. Rung 4.
name: review-gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  PR: ${{ github.event.pull_request.number }}

jobs:
  review-gate:
    runs-on: ubuntu-latest
    steps:
      - name: "Two named sessions in the PR body, plus a REVIEW: comment naming the reviewer"
        run: |
          set -euo pipefail

          body=$(gh pr view "$PR" --repo "$REPO" --json body -q '.body // ""')

          # Pull the value after the colon on the first matching line. `|| true`
          # absorbs grep's own exit 1 on no-match under `pipefail` -- an empty
          # variable is what "no line" looks like, and that is checked below
          # explicitly rather than by letting the script die on grep's exit code.
          # `\K\S+`, not `\K\S.*$`: the name is the first whitespace-delimited token on
          # the line, and anything after it is prose. `\S.*$` took the whole rest of the
          # line, so `Reviewed-by: chidionyema-03 -- KEEP, non-author, comment 5393770837`
          # sent this gate looking for a session with that entire sentence for a name
          # (PR #156, 2026-08-24). A session name has never contained a space.
          author_session=$(printf '%s\n' "$body" | grep -Po '^Author-session:\s*\K\S+' | head -1 || true)
          reviewed_by=$(printf '%s\n' "$body" | grep -Po '^Reviewed-by:\s*\K\S+' | head -1 || true)

          bad_name() {
            # empty, the unfilled "<...>" template placeholder, or the literal
            # word "author" (case-insensitive) -- none of those name a session.
            [ -z "$1" ] && return 0
            # `^<`, not `^<.*>$`: with one token taken, `<your session name>` arrives as
            # `<your`, which the closed-angle form would have waved through as a name.
            # No session on this estate is called something starting with `<`.
            printf '%s' "$1" | grep -q '^<' && return 0
            printf '%s' "$1" | grep -Piq '^author$' && return 0
            return 1
          }

          if bad_name "$author_session"; then
            echo "FAIL: no usable 'Author-session: <name>' line in the PR body (missing, empty, still the '<...>' placeholder, or literally 'author')." >&2
            exit 1
          fi
          if bad_name "$reviewed_by"; then
            echo "FAIL: no usable 'Reviewed-by: <name>' line in the PR body (missing, empty, still the '<...>' placeholder, or literally 'author')." >&2
            exit 1
          fi

          author_lc=$(printf '%s' "$author_session" | tr '[:upper:]' '[:lower:]')
          reviewer_lc=$(printf '%s' "$reviewed_by" | tr '[:upper:]' '[:lower:]')
          if [ "$author_lc" = "$reviewer_lc" ]; then
            echo "FAIL: Author-session and Reviewed-by name the same session ('$reviewed_by'). No self-review." >&2
            exit 1
          fi

          comments=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --slurp | jq 'add // []')
          reviews=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate --slurp | jq 'add // []')

          # Regex-escape the reviewer's name so it can sit inside a PCRE pattern
          # literally -- a name with a "." or "(" in it must not be read as regex
          # syntax.
          name_re=$(printf '%s' "$reviewed_by" | sed -E 's/[][\.^$*+?(){}|\\]/\\&/g')

          hit=$(jq -n --argjson c "$comments" --argjson r "$reviews" --arg namere "$name_re" '
            ($c + $r)
            | map(.body // "")
            | map(select(contains("REVIEW:")))
            | map(select(test("session[^A-Za-z0-9]{0,12}" + $namere; "i")))
            | length')

          if [ "$hit" -lt 1 ]; then
            echo "FAIL: no issue comment or review contains 'REVIEW:' together with 'session $reviewed_by' (e.g. 'REVIEW: <findings> — session $reviewed_by')." >&2
            exit 1
          fi

          echo "PASS: Author-session '$author_session' != Reviewed-by '$reviewed_by'; $hit REVIEW: comment(s)/review(s) naming session '$reviewed_by'."
