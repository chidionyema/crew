# crew#72 row 4 (LAW 35): once a week the research loop is graded on itself. The grade is a ledger
# entry, landed through a pull request with auto-merge because main's rulesets take no direct push.
name: self-grade
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: grade the week and land the entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 science/self_grade.py | tee grade.txt
          bash scripts/verify.d/80-research-ledger.sh
          b="science/self-grade-$(date -u +%Y%m%d)"
          git config user.name estate-agents; git config user.email 'estate-agents[bot]@users.noreply.github.com'
          git checkout -b "$b"; git add science/RESEARCH-LEDGER.jsonl
          git commit -m "science: weekly self-grade $(cut -f1 grade.txt) (crew#72)"
          git push origin "$b"
          gh pr create --head "$b" --base main --title "science: weekly self-grade $(cut -f1 grade.txt) (crew#72)" \
            --body "$(printf '%s\n\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
              "Closes #72 row 4. LAW 35 weekly self-grade, written by self-grade.yml: $(cat grade.txt)" \
              "Author-session: self-grade.yml" "Reviewed-by: schedule" "Cost-delta-usd-month: 0" \
              "## Architecture laws" "- LAW 1 zero-gravity: n/a: ledger entry only" "- LAW 2 fractal: n/a: ledger entry only" \
              "- LAW 3 nervous system: \`scripts/estate-snapshot\` research row" "- LAW 4 calibration: \`science/self_grade.py\`")"
          gh pr merge "$b" --auto --squash
