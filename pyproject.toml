# The first machine that reads this repo's Python.
#
# Measured on origin/main the day this file was written: 34 files, 6,173 lines, and no
# linter or type checker had ever been run over any of it. ruff found 67 defect-class
# hits and pyright found 24 errors in its *basic* mode, 13 of them attribute access on a
# value that can be None. Not one of them was a test failure, because nothing was looking.
#
# Two rules govern what is selected below, and both come from watching linters get
# switched off:
#
#   1. A rule earns its place by catching a defect, not a preference. `os.path.join`
#      instead of `pathlib` is a taste; `subprocess.run` without `check=` is a script
#      that carries on after `gh` failed and reports OK over nothing. Only the second
#      kind is here.
#   2. A guard that refuses correct work is an outage (LAW 38). Line length, statement
#      layout and exception-message style are deliberately absent. The day this gate
#      fails somebody's correct patch over a semicolon is the day it stops running.

# The Python floor. README.md has said "Python 3.11+" and crew-qa.yml has pinned 3.11
# since before this file existed, but the laptop venv every session ran gates through was
# 3.10.9, and nothing anywhere could see the disagreement. So `ruff check --fix` applied a
# 3.11-only rewrite (UP017, `timezone.utc` -> `datetime.UTC`), this standard graded its own
# rewrite PASS, and the collector then failed to import. A floor stated only in prose is
# not a floor: the two settings below are now asserted against the running interpreter by
# tests/test_incident_linter_target_newer_than_the_interpreter.py, and neither may be
# newer than it.

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "node_modules", "store", "storage"]

# One target for the whole repo assumes one interpreter runs the whole repo. Two scheduled
# programs are handed to Python 3.9.6 instead, because their launchd plists name
# /usr/bin/python3 in argv and set no PATH that would find a newer one:
#
#   com.founder.estatelander     argv: /usr/bin/python3 <repo>/scripts/estate-lander --push
#   com.founder.lawenforcement   argv: ... /usr/bin/python3 <repo>/science/law_enforcement.py
#   $ /usr/bin/python3 -V   ->   Python 3.9.6                       (measured 2026-08-24)
#
# The other scheduled jobs are not in this table because their plists set
# PATH=/opt/homebrew/bin:/usr/local/bin:... and get /usr/local/bin/python3, 3.14.6.
#
# Left at py311 these two are graded against an interpreter that never runs them, and
# `ruff check --fix` may rewrite them into names 3.9.6 does not have -- `datetime.UTC` is
# the one that already did it once, to science/collect.py. `py_compile` does not catch it,
# because the rewrite is an attribute access and not a syntax error: the file compiles, the
# standard says PASS, and the hourly job dies at import.
#
# Declaring the target rather than ignoring the rule is deliberate. An ignore list names
# the rules that have bitten so far and is silent about the next one; a target is the fact,
# and every version-gated rule reads it. Needs ruff >= 0.11 (this repo runs 0.16.4).
#
# tests/test_incident_linter_target_newer_than_the_interpreter.py asserts this table
# against the plists on the machine, so a new scheduled program cannot be added under the
# old interpreter without either an entry here or a red test.
[tool.ruff.per-file-target-version]
"scripts/estate-lander" = "py39"
"science/law_enforcement.py" = "py39"

[tool.ruff.lint]
select = [
    "F",        # pyflakes -- undefined name, unused import, f-string with no placeholder
    "E4",       # imports: shadowed, and module-level ones that are not at the top
    "E9",       # syntax and IO errors ruff could not parse past
    # E7 is NOT taken whole. Its prefix covers `x = 1; y = 2` (E702) and `if a: b`
    # (E701), which are layout, and 71 of them exist on main. Selecting the prefix
    # would have failed 71 correct lines on day one and got this file deleted by
    # lunchtime (LAW 38). The E7 rules that describe a defect are named individually:
    "E711",     # `== None` -- compares by value, matches things that are not None
    "E712",     # `== True`
    "E713", "E714",  # `not x in y`, `not x is y` -- parse the opposite of the intent
    "E721",     # `type(a) == type(b)` instead of isinstance
    "E722",     # bare `except:` -- catches SystemExit and KeyboardInterrupt too
    "E731",     # a lambda bound to a name, which loses the name in every traceback
    "E741",     # `l`, `I`, `O` as names -- 4 on main, and `l` is unreadable next to `1`
    "B",        # bugbear -- mutable default, loop-variable capture, raise-without-from
    "C4",       # comprehensions that silently build the wrong thing
    "DTZ",      # a datetime with no timezone. crew#107 is this defect, filed by hand.
    "BLE",      # `except Exception` -- swallows the failure you needed to see
    "S110",     # `try/except/pass` -- the same thing, written shorter
    "SIM115",   # a file opened and never closed
    "PLW1510",  # `subprocess.run` without `check=` -- 26 of these on main
    "I",        # import order. Not a defect; free to fix, and it ends the diff noise.
    "UP",       # constructs the target Python version has replaced
    "RUF",      # ruff's own checks, including the ones about mutable class attributes
]
ignore = [
    "E501",     # line length. `line-length` above formats; it does not fail a build.
]

[tool.ruff.lint.per-file-ignores]
# A test may import a module for its side effect and hold a file open on purpose.
"tests/*" = ["S110", "SIM115"]
"checkpoints/*" = ["S110", "SIM115"]

[tool.pyright]
# `standard`, not `strict`, for the repo: strict demands an annotation on every
# parameter of 6,173 lines that have none, which is a migration and not a gate.
typeCheckingMode = "standard"
pythonVersion = "3.11"
exclude = [".venv", "node_modules", "store", "storage", "**/__pycache__"]
reportMissingImports = "warning"   # several scripts import tools that are optional here
