[pytest]
# A bare `pytest -q` runs the unit suite only. The checkpoint tests live in
# checkpoints/ and are run one at a time by `crew verify CPn`, which names the
# directory explicitly. Keeping them out of the default run means an unbuilt
# checkpoint is a red box on the issue, not a red suite for everyone.
testpaths = tests
markers =
    cp1: crew tracks its own work through crew
    cp2: a conversation becomes a tracked issue with no person typing crew plan
    cp3: engineering claims a checkpoint and posts evidence with no person typing
    cp4: QA verifies on a runner engineering does not control
